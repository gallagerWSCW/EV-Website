<body>

        <li><a href="index.html">HOME</a></li>

    <h1 class="title">COST SAVINGS</h1>
    <div class="section">
        <img src="EV calc bg.jpg" class="bg-ev-calc">
        <div class="overlay">
            <img src="rectangle cost.png" class="img-ev-calc1">
            <div class="calculator">
                <h2>EV Cost Calculator</h2>
                <h3>Battery Capacity</h3>
                <div class="input-wrapper">
                    <input type="number" placeholder="60" id="battery">
                    <span class="unit">kWh</span>
                </div>
                <h3>Cost per kWh</h3>
                <div class="input-wrapper">
                    <input type="number" placeholder="0.30" step="0.01" id="cost">
                    <span class="unit">$</span>
                </div>
                <h3>Distance tavelled</h3>
                <div class="input-wrapper">
                    <input type="number" placeholder="400" id="distance">
                    <span class="unit">km</span>
                </div>
                <button class="calculator-button" onclick="calculateCost()">Calculate</button>
                <h3 id="result"></h3>
                <button class="reset-btn" onclick="resetCalculator()">Reset</button>
            </div>
        </div>

    </div>

    <div class="section">
        <img src="petrol calc bg.jpg" class="bg-petrol-calc">
        <div class="overlay">
            <div class="calculator">
                <h2>Fuel Cost Calculator</h2>
                <h3>Fuel Price</h3>
                <div class="input-wrapper">
                    <input type="number" placeholder="3" id="fuelPrice">
                    <span class="unit">$</span>
                </div>
                <h3>Fuel Consumption (L/100km)</h3>
                <div class="input-wrapper">
                    <input type="number" placeholder="10" step="0.01" id="fuelConsumption">
                    <span class="unit">L</span>
                </div>
                <button class="calculator-button2" onclick="calculateFuelCost()">Calculate</button>
                <h3 id="resultfuel"></h3>
                <button class="reset-btn" onclick="resetFuelCalculator()">Reset</button>
                
            </div>
        </div>

    </div>





</body>
