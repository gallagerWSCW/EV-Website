    <h1 class="title">COST SAVINGS</h1>
    <div class="section">
        <img src="EV calc bg.jpg" class="bg-ev-calc">
        <div class="overlay">
            <img src="rectangle cost.png" class="img-ev-calc1">
            <div class="calculator">
                <h2>EV Cost Calculator</h2>
                <h3>Battery Capacity</h3>
                <input type="number" id="battery">
                <h3>Cost pe kWh ($)</h3>
                <input type="number" step="0.01" id="cost">
                <h3>Distance tavelled (km)</h3>
                <input type="number" id="distance"><br><br>
                <button onclick="calculateCost()">Calculate</button>
                <h3 id="result"></h3>
                <button onclick="resetCalculator()">Reset</button>
                
            </div>
            <img src="EV calc img.jpg" class="img-ev-calc">
        </div>

    </div>

    <div class="section">
        <img src="petrol calc bg.jpg" class="bg-petrol-calc">
        <div class="overlay">
            <img src="rectangle cost.png" class="img-petrol-calc1">
            <div class="calculator">
                <h2>Fuel Cost Calculator</h2>
                <h3>Fuel Price</h3>
                <input type="number" id="fuelPrice">
                <h3>Fuel Consumption (L/100km)</h3>
                <input type="number" step="0.01" id="fuelConsumption">
                <button onclick="calculateFuelCost()">Calculate</button>
                <h3 id="resultfuel"></h3>
                <button onclick="resetFuelCalculator()">Reset</button>
                
            </div>
            <img src="petrol calc img.jpg" class="img-petrol-calc">
        </div>

    </div>
